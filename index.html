<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jenkins 101 Training</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#657083;--ac:#d24939;--ok:#16a34a;--bd:#e2e6ec;--cd:#0f172a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e6eaf0;--mu:#93a0b3;--ac:#ff7a68;--ok:#4ade80;--bd:#2a3440;--cd:#0b0f14}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e6eaf0;--mu:#93a0b3;--ac:#ff7a68;--ok:#4ade80;--bd:#2a3440;--cd:#0b0f14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0}h3{font-size:15px;margin:14px 0 4px}
.mu{color:var(--mu);font-size:13px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
button{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tabs button{white-space:nowrap}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}input[type=checkbox]{margin-top:4px;width:17px;height:17px;accent-color:var(--ok)}
.min{margin-left:auto;color:var(--mu);font-size:12px;white-space:nowrap;padding-left:8px}
.tr{border-left:4px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent);border-radius:8px;padding:8px 12px;margin-top:10px}
details{padding:4px 0}summary{cursor:pointer}details p{margin:4px 0 4px 16px;color:var(--mu)}
pre{background:var(--cd);color:#e6eaf0;padding:12px;border-radius:8px;overflow-x:auto;font-size:12.5px}
ul{margin:4px 0;padding-left:20px}a{color:var(--ac)}.nt{margin-left:26px}
</style></head><body><main>
<div class="row"><div><h1>Jenkins 101 Training</h1><div class="mu">5 days · hands-on · trainer and trainee reference</div></div>
<div class="row"><span><button id="rt">Trainee</button> <button id="rr">Trainer</button></span><button id="th">Theme</button></div></div>
<div class="card" id="ov"></div>
<div class="tabs" id="tabs"></div>
<div class="card" id="day"></div>
<div class="card"><b>Reference: sample Jenkinsfile</b><pre id="jf"></pre><b>Run Jenkins locally</b><pre id="dk"></pre></div>
<div class="card"><b>Further reading</b><ul><li><a href="https://www.jenkins.io/doc/book/" target="_blank" rel="noopener">Jenkins User Handbook</a></li><li><a href="https://www.jenkins.io/doc/pipeline/steps/" target="_blank" rel="noopener">Pipeline steps reference</a></li><li><a href="https://www.jenkins.io/doc/tutorials/" target="_blank" rel="noopener">Official tutorials</a></li><li><a href="https://plugins.jenkins.io/" target="_blank" rel="noopener">Plugin index</a></li></ul></div>
<div class="card row"><span class="mu">Ticks save in this browser only.</span><button id="rs">Reset ticks</button></div>
</main>
<script>
const D=[
{t:"Intro and setup",goal:"Explain CI/CD and Jenkins architecture, and run a first job.",
 tp:[["CI/CD concepts: why automate build, test, deploy",20],["Jenkins architecture: controller, agents, executors, jenkins_home",30],["Install via Docker, setup wizard, suggested plugins",25],["UI tour: dashboard, job, build, console output, Manage Jenkins",25]],
 lab:["Run Jenkins in Docker with a named volume for jenkins_home","Finish the setup wizard and create an admin user","Create a freestyle job that runs a shell echo step","Run it three times and find the console output and workspace"],
 tn:["Stress that all state lives in jenkins_home. Without a volume, a container restart loses everything.","Common pitfall: port 8080 already in use. Show how to map a different host port."],
 q:[["What is an executor?","One slot on a node that runs one build at a time."],["Where does Jenkins store jobs, config and build history?","In JENKINS_HOME on the controller (/var/jenkins_home in the container)."]]},
{t:"Freestyle jobs and SCM",goal:"Build from Git with parameters, triggers and archived artifacts.",
 tp:[["Git integration, branches and credentials for SCM",30],["Build parameters (string, choice, boolean)",20],["Triggers: manual, cron, poll SCM, webhooks",30],["Post-build actions: archive artifacts, publish test results, email",25]],
 lab:["Create a job that checks out a sample public repo","Add a choice parameter and use it in a shell step","Add a webhook or poll SCM trigger and push a commit","Archive a build artifact and download it from the build page"],
 tn:["Contrast polling with webhooks. Polling wastes load and delays builds, webhooks are event driven.","Show how to read the workspace path and wipe the workspace between builds."],
 q:[["Why prefer webhooks over polling?","Builds start immediately on push and the controller does not hit the Git server on a timer."],["Where are archived artifacts kept?","Under the build's directory in JENKINS_HOME, shown on the build page."]]},
{t:"Pipeline as code",goal:"Write declarative Jenkinsfiles and run them in multibranch pipelines.",
 tp:[["Why Jenkinsfile: versioned, reviewable, reusable",15],["Declarative syntax: pipeline, agent, stages, steps, post",35],["environment, parameters, when, parallel, input",35],["Multibranch pipeline and branch/PR builds",25]],
 lab:["Write a declarative Jenkinsfile with Build, Test and Package stages","Add a post block that archives results and reports failure","Add a parallel stage and a when condition on the branch","Create a multibranch pipeline pointing at your repo"],
 tn:["Teach declarative first. Mention scripted pipelines only as the escape hatch with script blocks.","Demo Replay and the Pipeline Syntax snippet generator. Trainees use them constantly."],
 q:[["Declarative vs scripted: which is the default for new work?","Declarative, because it is structured and validated before running."],["What does the post block do?","Runs steps after stages by outcome: always, success, failure, and so on."]]},
{t:"Agents, credentials and plugins",goal:"Scale builds across agents and handle secrets safely.",
 tp:[["Agent types: SSH, inbound, Docker and Kubernetes agents",30],["Labels and agent selection in a Jenkinsfile",15],["Credentials store: secret text, username/password, SSH keys",30],["Plugin management and shared library intro",30]],
 lab:["Attach one agent with a label (SSH or Docker)","Run a stage on that label","Store a secret and use it with withCredentials","Confirm the secret is masked in the console log"],
 tn:["Show what happens if someone echoes a secret into a file. Masking only covers exact log matches.","Warn about plugin sprawl: each plugin is upgrade and security surface. Keep the list short."],
 q:[["Why run builds on agents, not the controller?","It protects the controller from untrusted code and lets you scale horizontally."],["How do you keep secrets out of a Jenkinsfile?","Store them as credentials and inject with withCredentials or the credentials() helper."]]},
{t:"Operations, security and capstone",goal:"Secure and maintain Jenkins, then deliver an end-to-end pipeline.",
 tp:[["Authentication, matrix or role-based authorization",25],["Backups of jenkins_home and upgrade strategy (LTS)",20],["Jenkins Configuration as Code (JCasC) intro",20],["Monitoring, troubleshooting and best practices",25],["Capstone: build, test, Docker image, notify",45]],
 lab:["Create a read-only user and verify what it can see","Back up jenkins_home and restore it to a fresh container","Build the capstone pipeline from a Jenkinsfile in Git","Present it: stages, failures you hit, how you fixed them"],
 tn:["Always tell trainees to upgrade along the LTS line and test upgrades on a copy first.","Assess the capstone on a checklist: Jenkinsfile in Git, credentials used correctly, tests run, failure handled, notification sent."],
 q:[["What is JCasC?","A YAML file that describes Jenkins configuration so it is reproducible and reviewable."],["What must you back up?","JENKINS_HOME, especially jobs, config.xml files, credentials and secrets."]]}];
const J="https://www.jenkins.io/doc/book/";
const N=[[
["CI means merging small changes often and verifying each one with an automated build and tests. CD extends this to releasing: delivery keeps every build deployable, deployment ships it to production automatically. Jenkins is the automation server that runs these steps on every change.",J+"pipeline/"],
["The controller schedules builds, serves the UI and stores configuration. Agents (nodes) run the builds. A node has executors, and one executor runs one build at a time. Everything persistent (jobs, build history, credentials, plugins) lives in JENKINS_HOME, so treat the controller as precious and run real work on agents.",J+"scaling/architecting-for-scale/"],
["The Docker image runs Jenkins LTS. Map port 8080 for the UI and 50000 for inbound agents, and mount a named volume on /var/jenkins_home. The first-start password is in secrets/initialAdminPassword. The suggested plugins give you Git, Pipeline and credentials support.",J+"installing/docker/"],
["A job defines what to do, and a build is one run of it. The console output is your first debugging tool. Manage Jenkins holds system configuration, plugins, nodes, security and the system log. The workspace shows the files left by the last run.",J+"using/"]],
[
["The Git plugin clones the repo into the job workspace. Use a credential for private repos: an SSH key, or a username with a token. Set the branch specifier, for example */main. Use a clean checkout when builds must be reproducible.","https://plugins.jenkins.io/git/"],
["Parameters make a job reusable. String, choice and boolean cover most needs. In a shell step they appear as environment variables, so a parameter named ENV is read as $ENV.",J+"pipeline/syntax/#parameters"],
["Cron starts builds on a schedule. Poll SCM asks Git for changes on a schedule. A webhook lets the Git server call Jenkins on each push, so builds start at once with no polling load. Prefer webhooks whenever the Git server can reach Jenkins.","https://plugins.jenkins.io/github/"],
["Archiving keeps build outputs with the build record. Publishing JUnit XML gives trend graphs and per-test failures. Send notifications on failure or on recovery only, to keep the noise down.","https://www.jenkins.io/doc/pipeline/steps/junit/"]],
[
["A Jenkinsfile stored in the repo makes the pipeline versioned, reviewable and tied to the code it builds. Changes to the build go through the same pull request as the code.",J+"pipeline/jenkinsfile/"],
["Structure: pipeline, agent, stages, stage, steps. The post block runs after the stages, by outcome. Declarative syntax is validated before execution, so syntax errors fail fast. Use the Pipeline Syntax snippet generator to find step arguments.",J+"pipeline/syntax/"],
["environment sets variables, optionally from credentials. when skips a stage unless a condition holds, such as branch main. parallel runs stages at the same time on separate executors. input pauses for approval, so put it outside an agent block to avoid holding an executor while waiting.",J+"pipeline/syntax/#when"],
["A multibranch project scans the repo and creates a pipeline for each branch or pull request that has a Jenkinsfile. Branches appear and disappear automatically. Make it the default for application repos.",J+"pipeline/multibranch/"]],
[
["SSH agents are launched by the controller over SSH. Inbound agents connect to the controller with a secret, which suits agents behind firewalls. Docker and Kubernetes agents are ephemeral: a fresh container for each build gives a clean, reproducible environment.",J+"managing/nodes/"],
["Labels describe what an agent offers, such as linux or docker. agent { label 'linux' } picks any matching node. Set the controller’s executors to 0 so builds never run there.",J+"pipeline/syntax/#agent"],
["Credentials are stored encrypted and referenced by ID. Use withCredentials or credentials() so values are masked in logs. Scope them to a folder when only one team needs them. Never hardcode a secret in a Jenkinsfile.",J+"using/using-credentials/"],
["Plugins add features but also upgrade and security surface, so install only what you need and keep them updated. Shared libraries keep reusable pipeline code in a Git repo that Jenkinsfiles load with @Library.",J+"pipeline/shared-libraries/"]],
[
["Jenkins can use its own user database, LDAP or SSO. Authorization decides what each user may do: matrix-based gives per-permission control, and Role-Based Strategy groups permissions into roles. Disable anonymous access and give users the least they need.",J+"security/"],
["Back up JENKINS_HOME on a schedule (config files, jobs, secrets) and test a restore. Upgrade along LTS releases, read the changelog, update plugins together, and rehearse the upgrade on a copy first.",J+"system-administration/backing-up/"],
["Configuration as Code describes controller settings in YAML loaded at startup: security, agents, credential references. It makes setups repeatable and reviewable instead of clicked together in the UI.",J+"managing/casc/"],
["Watch disk space on JENKINS_HOME, queue length and agent availability. The system log and the build console are the first stops. Usual causes of failure: full disk, offline agent, plugin mismatch, expired credential. Keep jobs in code and rotate old builds.",J+"system-administration/"],
["Build a pipeline that tests an app, builds a Docker image and sends a notification, all from a Jenkinsfile in Git. Use credentials for any registry login. It ties together everything from the five days.","https://plugins.jenkins.io/docker-workflow/"]]];
const A=[[
["Persistent Jenkins","Run Jenkins with a named volume, remove the container, then start a new one on the same volume.","your admin user and job are still there."],
["Build report job","Make a freestyle job that prints the date, hostname and whoami. Run it 5 times and note the durations.","you can say where the workspace, build logs and config.xml live on disk."]],[
["Parameterized build","Clone a public repo and add a BRANCH choice parameter. Build the branch the user picks.","builds of two different branches show different commits in the log."],
["Trigger on push","Trigger the job from a webhook (use a tunnel or a reachable host). If you cannot expose Jenkins, use Poll SCM every minute instead.","a push starts a build, and you can explain the webhook vs polling trade-off."]],[
["Three-stage pipeline","Write a Jenkinsfile for a small Python or Node app: install, test, package. Make a test fail on purpose, then fix it.","the build goes red, then green, and test results show on the build page."],
["Branch-aware pipeline","Add a Deploy stage that runs only on main, and run lint and unit tests in parallel. Use a multibranch job with a feature branch.","the feature branch skips Deploy and main runs it."]],[
["Run on an agent","Add a Docker or SSH agent labelled build-1 and run hostname in a stage on it.","the log shows the agent’s hostname and the controller has 0 executors."],
["Secret handling","Create a secret text credential, use it in a pipeline, and try to echo it.","the log shows **** and the Jenkinsfile contains no secret."]],[
["Least privilege","Create a viewer and a developer user with different permissions.","the viewer cannot run builds, the developer can, and anonymous sees nothing."],
["Capstone pipeline","From a Git repo: test, build a Docker image tagged with the build number, notify on failure. Present it in 10 minutes.","Jenkinsfile is in Git, credentials are used correctly, tests run, and you demo the failure path."],
["Backup drill","Back up JENKINS_HOME and restore it into a fresh container.","jobs and users are back after the restore."]]];
const JF=`pipeline {
  agent { label 'linux' }
  options { timeout(time: 30, unit: 'MINUTES') }
  environment { APP = 'demo' }
  stages {
    stage('Build') { steps { sh 'make build' } }
    stage('Test') {
      steps { sh 'make test' }
      post { always { junit 'reports/*.xml' } }
    }
    stage('Deploy') {
      when { branch 'main' }
      steps {
        withCredentials([string(credentialsId: 'tok', variable: 'TOK')]) {
          sh './deploy.sh'
        }
      }
    }
  }
  post { failure { echo 'Build failed' } }
}`;
const DK="docker run -d --name jenkins -p 8080:8080 -p 50000:50000 \\\n  -v jenkins_home:/var/jenkins_home jenkins/jenkins:lts-jdk17\n# initial admin password:\ndocker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword";
const $=id=>document.getElementById(id);
let S={role:"trainee",day:0,c:{}};
try{const x=JSON.parse(localStorage.getItem("j101")||"null");if(x)S=Object.assign(S,x)}catch(e){}
const sv=()=>{try{localStorage.setItem("j101",JSON.stringify(S))}catch(e){}};
const tot=D.reduce((a,d,i)=>a+d.tp.length+d.lab.length+A[i].length,0);
function dayDone(i){return Object.keys(S.c).filter(k=>k.startsWith("d"+i+"_")).length}
function render(){
 const T=S.role==="trainer",done=Object.keys(S.c).length,p=Math.round(done/tot*100);
 $("rt").className=T?"":"on";$("rr").className=T?"on":"";
 const mins=D.map(d=>d.tp.reduce((a,x)=>a+x[1],0));
 $("ov").innerHTML=`<b>About this course</b><ul><li>Audience: engineers new to Jenkins. Prerequisites: basic Linux shell, Git, and Docker.</li><li>Format: about 2 hours of talk plus hands-on labs each day, 5 days.</li><li>Outcome: build a CI pipeline as code, run it on agents with secrets handled safely, and know how to operate Jenkins.</li></ul><div class="row"><span class="mu">${T?"Trainer view: notes, timings and answers shown":"Trainee view: tick topics and labs as you complete them"}</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div>`;
 $("tabs").innerHTML=D.map((d,i)=>`<button data-d="${i}" class="${i===S.day?"on":""}">Day ${i+1}${dayDone(i)===d.tp.length+d.lab.length+A[i].length?" ✓":""}</button>`).join("");
 const d=D[S.day],i=S.day,ck=(k,txt,m)=>`<label><input type="checkbox" data-k="${k}"${S.c[k]?" checked":""}><span>${txt}</span>${m?`<span class="min">${m} min</span>`:""}</label>`;
 $("day").innerHTML=`<b style="font-size:18px">Day ${i+1}: ${d.t}</b><div class="mu">${d.goal} Talk time: ${mins[i]} min.</div>
 <h3>Topics and study notes</h3>${d.tp.map((x,k)=>ck("d"+i+"_t"+k,x[0],x[1])+`<details class="nt"><summary class="mu">Study notes</summary><p>${N[i][k][0]} <a href="${N[i][k][1]}" target="_blank" rel="noopener">Reference ↗</a></p></details>`).join("")}
 <h3>Hands-on lab</h3>${d.lab.map((x,k)=>ck("d"+i+"_l"+k,x)).join("")}
 <h3>Assignments</h3>${A[i].map((x,k)=>ck("d"+i+"_a"+k,`<b>${x[0]}.</b> ${x[1]}<br><span class="mu">Done when: ${x[2]}</span>`)).join("")}
 <h3>Check your understanding</h3>${d.q.map(x=>`<details${T?" open":""}><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join("")}
 ${T?`<div class="tr"><b>Trainer notes</b><ul>${d.tn.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}`;
}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.day=+b.dataset.d;sv();render()};
$("day").onchange=e=>{const c=e.target;if(!c.dataset.k)return;if(c.checked)S.c[c.dataset.k]=1;else delete S.c[c.dataset.k];sv();render()};
$("rt").onclick=()=>{S.role="trainee";sv();render()};$("rr").onclick=()=>{S.role="trainer";sv();render()};
$("rs").onclick=()=>{if(confirm("Clear all ticks?")){S.c={};sv();render()}};
$("th").onclick=()=>{const r=document.documentElement;r.dataset.theme=getComputedStyle(r).getPropertyValue("--bg").trim()==="#12161c"?"light":"dark"};
$("jf").textContent=JF;$("dk").textContent=DK;render();
</script></body></html>
